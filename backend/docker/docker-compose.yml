name: setu

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: setu
      POSTGRES_PASSWORD: setu
      POSTGRES_DB: setu
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setu -d setu"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Redpanda speaks the Kafka protocol but runs as a single process with no
  # ZooKeeper, which keeps the "kill a broker / kill a worker" demo simple.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=1G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092
      # Clients inside the compose network use redpanda:9092; clients on the
      # host use localhost:19092. Both must be advertised or one side breaks.
      - --advertise-kafka-addr=INTERNAL://redpanda:9092,EXTERNAL://localhost:19092
    ports:
      - "19092:19092"
      - "9644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  console:
    image: redpandadata/console:v2.7.2
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8081:8080"

  # Scrapes the API and worker(s), which run on the host via uv, not in
  # compose -- see docker/prometheus/prometheus.yml for how it reaches
  # them through host.docker.internal.
  prometheus:
    image: prom/prometheus:v2.55.1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    depends_on:
      - prometheus
    environment:
      # Anonymous admin access: this stack is local-only with no auth
      # anywhere else either (Postgres is setu/setu, Redpanda Console has
      # none) -- a login prompt would just be friction for a local demo.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"

  # All-in-one image: OTLP receiver (spans arrive on 4317/grpc) + its own
  # UI (16686), no separate collector/storage needed for local use. The
  # API and workers reach it at localhost:4317, same host-not-in-compose
  # situation as Prometheus's targets above, just in the other direction
  # (host process -> compose service, via the published port, rather than
  # compose -> host.docker.internal).
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"

  # Browser-based Postgres table viewer, for watching Jobs/Results/
  # OutboxEvents/WorkerExecutions rows live during demos instead of running
  # queries by hand. ADMINER_DEFAULT_SERVER pre-fills the server field with
  # the compose service name; still needs the setu/setu login typed in
  # (unlike Grafana/Console, this one fronts real data, so no anonymous
  # access here).
  adminer:
    image: adminer:4.8.1
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    ports:
      - "8082:8080"

volumes:
  postgres_data:
  redpanda_data:
  prometheus_data:
  grafana_data:
